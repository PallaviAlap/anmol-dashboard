<div class="d-block d-md-flex w-100 bg-white justify-content-between">
  <div class="login-header pt-2 pb-2">
    <div class="text-center">
      <img src="assets/img/sigin_logo.png" class="img-fluid" alt="logo">
    </div>
    <div>
      <h5 class="ms-2 me-2">Anmol Madhya Pradesh</h5>
    </div>
    <div class="text-center">
      <img src="assets/img/sigin_logo_1.png" class="img-fluid" alt="logo">
    </div>
  </div>

  <div class="d-block align-items-middle p-3">
    <button class="btn btn-sm btn-outline-warning me-2">
      Dashboard Login
    </button>
    <button class="btn btn-sm btn-outline-warning">
      Admin Login
    </button>
  </div>
</div>

<div class="container-fluid pt-3">
  <div class="row">
    <div class="col-xl-12">
      <span class="fw-bold pt-3">
        ← Back
      </span>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-4 mx-auto">
      <div class="card">
        <div class="card-body">
          <div class="border-0 p-4 rounded mb-2">

            <h5 class="mb-3">Change Password</h5>

            <form class="row">

              <div class="col-12 mb-3">
                <label class="form-label">Enter User Name</label>
                <input type="text" class="form-control" placeholder="Enter your Name">
              </div>

              <div class="col-12 mb-3">
                <label class="form-label">Enter Mobile Number</label>
                <input type="text" class="form-control" placeholder="9876543210">
              </div>

              <div class="col-12 mb-3">
                <label class="form-label">Enter Email ID</label>
                <input type="email" class="form-control" placeholder="Enter Email ID">
              </div>

              <div class="col-12 mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" placeholder="Enter Password">
              </div>

              <div class="col-12 mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Enter Password">
              </div>

              <div class="col-12 mb-3">
                <button class="btn text-white w-100"
                  style="background: linear-gradient(90deg, rgba(239,66,1,1) 0%, rgba(211,71,52,1) 100%);">
                  Send OTP
                </button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
